<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Opening & Closing — Archet Sheets</title>
<link rel="icon" href="/archet-logo.png"><link rel="stylesheet" href="/assets/store-hours.css"><link rel="stylesheet" href="/assets/store-hours-sheet.css"></head>
<body>
<section id="sheet-login" hidden><form id="sheet-login-form"><img class="sheet-brand" src="/archet-logo.png" alt="Archet Solutions"><h1>Archet Sheets</h1><p>Sign in with your portal account to open the shared Opening & Closing spreadsheet.</p><label>Username<input id="sheet-username" autocomplete="username" required></label><label>Password<input id="sheet-password" type="password" autocomplete="current-password" required></label><p id="sheet-login-error" role="alert"></p><button type="submit">Sign in</button></form></section>
<main id="sheet-app" hidden>
  <header class="sheet-header"><a class="sheet-logo" href="/internal" title="Back to portal"><img src="/archet-logo.png" alt="Archet Solutions"></a><div class="sheet-heading"><h1>Store Opening & Closing <span>Archet Solutions</span></h1><nav id="sheet-menu" aria-label="Spreadsheet menus"></nav></div><span class="sheet-autosave" title="Edits save automatically after you finish typing">AutoSave <b>On</b></span><button id="sheet-period-button" aria-haspopup="dialog" title="Choose a report date or range">Choose date</button><div class="sheet-save-state" id="sheet-save-state" role="status">Loading…</div><div class="sh-tools"><div class="sh-actions"></div></div><button id="sheet-save" class="sheet-primary">Save changes</button><button id="sheet-account" title="Sign out" aria-label="Sign out"></button></header>
  <div class="sheet-format-bar" role="toolbar" aria-label="Cell formatting">
    <button data-command="undo" title="Undo (Ctrl+Z)">↶</button><button data-command="redo" title="Redo (Ctrl+Y)">↷</button><span class="sheet-separator"></span>
    <select id="sheet-zoom" aria-label="Zoom"><option>75%</option><option selected>100%</option><option>125%</option><option>150%</option></select>
    <select id="sheet-number-format" aria-label="Cell number format"><option value="auto">Automatic</option><option value="text">Plain text</option><option value="number">Number · 0.00</option><option value="currency">Currency · $</option><option value="percent">Percent · %</option><option value="date">Date</option><option value="time">Time</option></select>
    <span class="sheet-separator"></span><select id="sheet-font-family" aria-label="Font family" title="Uses installed fonts, with Arial as fallback"><option>Arial</option><option>Calibri</option><option>Aptos</option><option>Cambria</option><option>Times New Roman</option><option>Georgia</option><option>Verdana</option><option>Tahoma</option><option>Trebuchet MS</option><option>Segoe UI</option><option>Courier New</option><option>Consolas</option></select><select id="sheet-font-size" aria-label="Font size"><option>8</option><option>9</option><option selected>10</option><option>11</option><option>12</option><option>14</option><option>16</option><option>20</option><option>24</option><option>28</option></select>
    <button data-format="bold" title="Bold" aria-label="Bold" aria-pressed="false"><b>B</b></button><button data-format="italic" title="Italic" aria-label="Italic" aria-pressed="false"><i>I</i></button><button data-format="underline" title="Underline" aria-label="Underline" aria-pressed="false"><u>U</u></button>
    <label class="sheet-color" title="Text color">A<input id="sheet-text-color" type="color" value="#202124" aria-label="Text color"></label><label class="sheet-color" title="Fill color">▰<input id="sheet-fill-color" type="color" value="#ffffff" aria-label="Fill color"></label><button id="sheet-borders" title="Borders for selected cells" aria-haspopup="dialog">▦ Borders</button><span class="sheet-separator"></span>
    <select id="sheet-align" aria-label="Text alignment"><option value="left">Align left</option><option value="center">Center</option><option value="right">Align right</option></select><button data-format="wrap" title="Wrap text" aria-label="Wrap text" aria-pressed="false">↵</button><button id="sheet-clear-format" title="Clear formatting">T×</button><span class="sheet-separator"></span><button id="sheet-add-column">＋ Column</button><button id="sheet-filter-toggle" aria-pressed="false">☷ Filters</button><button data-command="commands" title="F8 replaces Excel Alt commands">Commands <kbd>F8</kbd></button><button data-command="tutorial">? Help</button>
  </div>
  <div id="sheet-filters" hidden><label>Dealer<select id="sheet-dealer"><option value="">All dealers</option></select></label><label>Market<select id="sheet-market"><option value="">All markets</option></select></label><label>Store<select id="sheet-store"><option value="">All stores</option></select></label><label>From<input id="sheet-from" type="date"></label><label>To<input id="sheet-to" type="date"></label><button id="sheet-apply-period">Apply period</button><button id="sheet-today">Today</button><button id="sheet-month">This month</button><label class="sheet-search-label">Find<input id="sheet-search" type="search" placeholder="Search rows"></label><button id="sheet-clear-filters">Clear column filters</button></div>
  <div class="sheet-formula-bar"><div id="sheet-address-slot"></div><span class="sheet-fx">ƒx</span><input id="sheet-value" aria-label="Selected cell value" placeholder="Select a cell to edit its value" autocomplete="off"><span id="sheet-value-label"></span></div>
  <div id="sheet-message" role="status" hidden></div>
  <div class="sh-table-wrap sheet-grid-wrap"><table id="sh-table"><thead><tr></tr></thead><tbody></tbody></table><div id="sheet-empty" hidden>No rows match these filters.</div></div>
  <footer class="sheet-footer"><button id="sheet-add-row" title="Add employee row">＋ Row</button><span class="sheet-tab">Opening & Closing <span id="sheet-period"></span></span><span id="sheet-row-count"></span><span id="sheet-selection-status"></span><button id="sheet-prev" aria-label="Previous page">‹</button><span id="sheet-page"></span><button id="sheet-next" aria-label="Next page">›</button></footer>
</main>
<dialog id="sheet-dialog"><div class="sheet-dialog-heading"><h2 id="sheet-dialog-title"></h2><button id="sheet-dialog-close" aria-label="Close dialog">×</button></div><div id="sheet-dialog-content"></div></dialog>
<script src="/assets/store-hours-snapshot.js"></script><script src="/assets/store-hours-grid.js"></script><script src="/assets/store-hours-history.js"></script><script src="/assets/store-hours-sheet.js"></script>
</body></html>
